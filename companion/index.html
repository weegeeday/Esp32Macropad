<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP-Macropad Companion</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%233b82f6'%3E%3Crect width='100' height='100' rx='20' fill='%231e293b'/%3E%3Crect x='20' y='20' width='25' height='25' rx='5' fill='%2360a5fa'/%3E%3Crect x='55' y='20' width='25' height='25' rx='5' fill='%2360a5fa'/%3E%3Crect x='20' y='55' width='25' height='25' rx='5' fill='%2360a5fa'/%3E%3Crect x='55' y='55' width='25' height='25' rx='5' fill='%2360a5fa'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        glass: "rgba(255, 255, 255, 0.05)",
                        glassBorder: "rgba(255, 255, 255, 0.1)",
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-glow:hover {
            box-shadow: 0 0 15px currentColor;
        }

        /* Color input styling */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            background: none;
            cursor: pointer;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <!-- Header -->
    <header class="w-full max-w-4xl mb-8 flex justify-between items-center">
        <h1
            class="text-4xl font-light tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
            ESP-Macropad <span class="font-bold">Companion</span>
        </h1>
        <div class="flex gap-4">
            <button id="connectBtn"
                class="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition-all shadow-lg shadow-blue-900/50 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                Connect
            </button>
            <div class="relative">
                <button id="wifiBtn" disabled
                    class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition-all flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-slate-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" />
                    </svg>
                </button>
                <div id="wifiDropdown"
                    class="hidden absolute top-full right-0 mt-2 w-72 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl p-4 z-50 flex flex-col gap-3">
                    <h3 class="text-sm font-semibold text-slate-300">WiFi Configuration</h3>
                    <div>
                        <input type="text" id="wifiSsid" placeholder="SSID"
                            class="w-full bg-slate-900/50 border border-slate-600 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <input type="password" id="wifiPass" placeholder="Password"
                            class="w-full bg-slate-900/50 border border-slate-600 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                    <button id="saveWifiBtn"
                        class="w-full py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-sm rounded transition-colors">
                        Save Credentials
                    </button>
                </div>
            </div>
            <button id="refreshBtn"
                class="hidden px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition-all"
                title="Refresh Config">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>
    </header>

    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-8">

        <!-- Left Column: Visualizer -->
        <section class="glass-panel p-8 rounded-2xl flex flex-col items-center gap-6 relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-br from-blue-500/5 to-purple-500/5 pointer-events-none"></div>

            <h2 class="text-xl font-semibold text-slate-300 w-full">Device Preview</h2>

            <div class="grid grid-flow-col grid-rows-4 gap-4 bg-slate-800/50 p-6 rounded-xl border border-slate-700/50 shadow-inner overflow-x-auto"
                id="buttonGrid">
                <!-- Generated via JS -->
                <div class="w-16 h-16 rounded-lg bg-slate-700 animate-pulse"></div>
                <div class="w-16 h-16 rounded-lg bg-slate-700 animate-pulse"></div>
                <!-- ... -->
            </div>

            <div class="w-full p-4 bg-slate-800/30 rounded-lg flex items-center justify-between">
                <span class="text-sm text-slate-400">Base Color</span>
                <input type="color" id="baseColorPicker" value="#000000">
            </div>



            <div id="statusMessage" class="text-sm text-slate-500 font-mono h-6 transition-colors duration-300">Ready to
                connect...</div>
        </section>

        <!-- Right Column: Editor -->
        <section class="glass-panel p-8 rounded-2xl flex flex-col gap-6 relative">
            <div id="editorDisabledOverlay"
                class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm z-10 flex items-center justify-center rounded-2xl">
                <p class="text-slate-400">Select a button to edit</p>
            </div>

            <header class="flex justify-between items-center border-b border-slate-700/50 pb-4">
                <h2 class="text-xl font-semibold text-slate-200">Edit Button <span id="editorBtnIndex"
                        class="text-blue-400">#</span></h2>
            </header>

            <div class="space-y-4">
                <!-- Type Selection -->
                <div class="space-y-2">
                    <label class="text-xs text-slate-400 uppercase tracking-wider">Button Type</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button
                            class="type-btn px-3 py-2 rounded-md text-sm border border-slate-600 hover:bg-slate-700 transition"
                            data-type="0">HID</button>
                        <button
                            class="type-btn px-3 py-2 rounded-md text-sm border border-slate-600 hover:bg-slate-700 transition"
                            data-type="1">HomeKit</button>
                        <button
                            class="type-btn px-3 py-2 rounded-md text-sm border border-slate-600 hover:bg-slate-700 transition"
                            data-type="2">Macro</button>
                    </div>
                </div>

                <!-- Modifiers (HID Only) -->
                <div id="modifiersSection" class="space-y-2 hidden">
                    <label class="text-xs text-slate-400 uppercase tracking-wider">Modifiers</label>
                    <div class="flex flex-wrap gap-2">
                        <label
                            class="flex items-center gap-2 bg-slate-900/50 px-3 py-2 rounded-md border border-slate-700 cursor-pointer hover:bg-slate-800 transition">
                            <input type="checkbox" data-mod="1"
                                class="modifier-cb w-4 h-4 rounded border-slate-600 bg-slate-800 text-blue-600 focus:ring-blue-500">
                            <span class="text-sm text-slate-300">Ctrl</span>
                        </label>
                        <label
                            class="flex items-center gap-2 bg-slate-900/50 px-3 py-2 rounded-md border border-slate-700 cursor-pointer hover:bg-slate-800 transition">
                            <input type="checkbox" data-mod="2"
                                class="modifier-cb w-4 h-4 rounded border-slate-600 bg-slate-800 text-blue-600 focus:ring-blue-500">
                            <span class="text-sm text-slate-300">Shift</span>
                        </label>
                        <label
                            class="flex items-center gap-2 bg-slate-900/50 px-3 py-2 rounded-md border border-slate-700 cursor-pointer hover:bg-slate-800 transition">
                            <input type="checkbox" data-mod="4"
                                class="modifier-cb w-4 h-4 rounded border-slate-600 bg-slate-800 text-blue-600 focus:ring-blue-500">
                            <span class="text-sm text-slate-300">Alt</span>
                        </label>
                        <label
                            class="flex items-center gap-2 bg-slate-900/50 px-3 py-2 rounded-md border border-slate-700 cursor-pointer hover:bg-slate-800 transition">
                            <input type="checkbox" data-mod="8"
                                class="modifier-cb w-4 h-4 rounded border-slate-600 bg-slate-800 text-blue-600 focus:ring-blue-500">
                            <span class="text-sm text-slate-300">Gui</span>
                        </label>
                    </div>
                </div>

                <!-- Value Input -->
                <div class="space-y-2">
                    <label class="text-xs text-slate-400 uppercase tracking-wider flex justify-between">
                        <span>Value / Code</span>
                        <span class="text-slate-500" id="valueHint">HID Usage Code (e.g. 4 for 'a')</span>
                    </label>
                    <input type="number" id="editorValue"
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-200 font-mono">
                </div>

                <!-- Color Picker -->
                <div class="space-y-2">
                    <label class="text-xs text-slate-400 uppercase tracking-wider">LED Color</label>
                    <div class="flex items-center gap-4 bg-slate-900/50 p-3 rounded-lg border border-slate-700">
                        <input type="color" id="editorColor">
                        <span id="editorColorHex" class="font-mono text-sm text-slate-400">#000000</span>
                    </div>
                </div>
            </div>

            <div class="mt-auto pt-6 flex justify-end">
                <button id="saveBtn"
                    class="px-6 py-2 bg-green-600 hover:bg-green-500 text-white rounded-lg transition-all shadow-lg shadow-green-900/30 font-semibold">
                    Save Changes
                </button>
            </div>
        </section>
    </main>

    <script>
        // --- State ---
        let port;
        let reader;
        let writer;
        let keepReading = false;
        let config = {
            baseColor: [0, 0, 0],
            buttons: Array(8).fill().map((_, i) => ({ type: 0, value: 0, modifiers: 0, color: [0, 0, 0] }))
        };
        let selectedBtnIndex = -1;

        // --- UI Refs ---
        const connectBtn = document.getElementById('connectBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const statusMsg = document.getElementById('statusMessage');
        const buttonGrid = document.getElementById('buttonGrid');
        const baseColorPicker = document.getElementById('baseColorPicker');

        // Editor Refs
        const editorOverlay = document.getElementById('editorDisabledOverlay');
        const editorIndexLabel = document.getElementById('editorBtnIndex');
        const typeBtns = document.querySelectorAll('.type-btn');
        const modifiersSection = document.getElementById('modifiersSection');
        const modifierCbs = document.querySelectorAll('.modifier-cb');
        const editorValue = document.getElementById('editorValue');
        const editorColor = document.getElementById('editorColor');
        const editorColorHex = document.getElementById('editorColorHex');
        const saveBtn = document.getElementById('saveBtn');
        const wifiBtn = document.getElementById('wifiBtn');
        const wifiDropdown = document.getElementById('wifiDropdown');

        // --- Initialization ---
        renderGrid();

        // --- Event Listeners ---
        wifiBtn.addEventListener('click', (e) => {
            if (wifiBtn.disabled) return;
            wifiDropdown.classList.toggle('hidden');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!wifiBtn.contains(e.target)) {
                wifiDropdown.classList.add('hidden');
            }
        });

        connectBtn.addEventListener('click', async () => {
            if (port) {
                // Disconnect logic if needed, usually just reload page for simple Web Serial apps
                window.location.reload();
                return;
            }
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });

                connectBtn.innerHTML = `
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    Disconnect
                `;
                connectBtn.classList.replace('bg-blue-600', 'bg-red-600');
                connectBtn.classList.replace('hover:bg-blue-500', 'hover:bg-red-500');
                refreshBtn.classList.remove('hidden');
                wifiBtn.disabled = false;

                setStatus('Connected', 'green');

                keepReading = true;
                readLoop();
                writeToSerial("GET_CONFIG\n"); // Initial fetch

            } catch (err) {
                console.error(err);
                setStatus('Connection failed: ' + err.message, 'red');
            }
        });

        refreshBtn.addEventListener('click', () => {
            writeToSerial("GET_CONFIG\n");
        });

        // Editor: Type Selection
        typeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (selectedBtnIndex === -1) return;

                // Update UI state
                typeBtns.forEach(b => {
                    b.classList.remove('bg-blue-600', 'text-white', 'border-blue-500');
                    b.classList.add('border-slate-600');
                });
                btn.classList.add('bg-blue-600', 'text-white', 'border-blue-500');
                btn.classList.remove('border-slate-600');

                const newType = parseInt(btn.dataset.type);
                config.buttons[selectedBtnIndex].type = newType;

                updateEditorVisibility(newType);
                updateValueHint();
            });
        });

        // Editor: Modifiers
        modifierCbs.forEach(cb => {
            cb.addEventListener('change', () => {
                if (selectedBtnIndex === -1) return;

                // Re-calculate bitmask
                let mask = 0;
                modifierCbs.forEach(c => {
                    if (c.checked) mask |= parseInt(c.dataset.mod);
                });
                config.buttons[selectedBtnIndex].modifiers = mask;
            });
        });

        // Editor: Value
        editorValue.addEventListener('change', (e) => {
            if (selectedBtnIndex === -1) return;
            config.buttons[selectedBtnIndex].value = parseInt(e.target.value);
        });

        // Editor: Color
        editorColor.addEventListener('input', (e) => {
            if (selectedBtnIndex === -1) return;
            const rgb = hexToRgb(e.target.value);
            config.buttons[selectedBtnIndex].color = [rgb.r, rgb.g, rgb.b];
            editorColorHex.textContent = e.target.value.toUpperCase();

            // Live update the grid preview
            renderGrid();
        });

        // Base Color
        baseColorPicker.addEventListener('change', async (e) => {
            const rgb = hexToRgb(e.target.value);
            config.baseColor = [rgb.r, rgb.g, rgb.b];

            const cmd = `SET_BASE R ${rgb.r} G ${rgb.g} B ${rgb.b}\n`;
            setStatus('Saving Base Color...', 'blue');
            await writeToSerial(cmd);
            setStatus('Saved Base Color', 'green');
        });

        // Save Button
        saveBtn.addEventListener('click', async () => {
            if (selectedBtnIndex === -1) return;

            const btn = config.buttons[selectedBtnIndex];
            // CMD: SET_BTN <idx> TYPE <type> VAL <val> MOD <mod> R <r> G <g> B <b>
            // Include MOD even if 0, firmware handles it
            const cmd = `SET_BTN ${selectedBtnIndex} TYPE ${btn.type} VAL ${btn.value} MOD ${btn.modifiers || 0} R ${btn.color[0]} G ${btn.color[1]} B ${btn.color[2]}\n`;

            setStatus(`Saving Button ${selectedBtnIndex}...`, 'blue');
            await writeToSerial(cmd);
            setStatus('Saved!', 'green');

            // Re-fetch to confirm
            setTimeout(() => writeToSerial("GET_CONFIG\n"), 200);
        });

        // WiFi Save
        document.getElementById('saveWifiBtn').addEventListener('click', async () => {
            const ssid = document.getElementById('wifiSsid').value;
            const pass = document.getElementById('wifiPass').value;

            if (!ssid || !pass) {
                setStatus('SSID and Password required', 'red');
                return;
            }

            const hexSsid = xorEncrypt(ssid);
            const hexPass = xorEncrypt(pass);

            const cmd = `SET_WIFI ${hexSsid} ${hexPass}\n`;
            setStatus('Sending WiFi Credentials...', 'blue');
            await writeToSerial(cmd);
        });

        // --- Core Functions ---

        function renderGrid() {
            buttonGrid.innerHTML = '';
            config.buttons.forEach((btn, idx) => {
                const div = document.createElement('div');
                div.className = `w-full aspect-square rounded-lg cursor-pointer transition-all border border-slate-700 relative group`;

                // Color preview
                const brightness = (btn.color[0] + btn.color[1] + btn.color[2]) / 3;
                div.style.backgroundColor = `rgb(${btn.color[0]}, ${btn.color[1]}, ${btn.color[2]})`;
                div.style.boxShadow = `0 0 ${brightness > 50 ? 15 : 5}px rgb(${btn.color[0]}, ${btn.color[1]}, ${btn.color[2]})`;

                if (idx === selectedBtnIndex) {
                    div.classList.add('ring-2', 'ring-white', 'scale-105', 'z-10');
                }

                div.addEventListener('click', () => selectButton(idx));
                buttonGrid.appendChild(div);
            });

            // Initial selection if none
            if (selectedBtnIndex === -1 && config.buttons.length > 0) {
                // selectButton(0); // Optional: Auto select first
            }
        }

        function selectButton(index) {
            selectedBtnIndex = index;
            const btn = config.buttons[index];
            renderGrid();

            editorOverlay.classList.add('hidden');
            editorIndexLabel.textContent = index;
            editorValue.value = btn.value;

            // Update color picker
            const hex = rgbToHex(btn.color[0], btn.color[1], btn.color[2]);
            editorColor.value = hex;
            editorColorHex.textContent = hex.toUpperCase();

            // Type buttons
            typeBtns.forEach(b => {
                b.classList.remove('bg-blue-600', 'text-white', 'border-blue-500');
                b.classList.add('border-slate-600');
                if (parseInt(b.dataset.type) === btn.type) {
                    b.classList.add('bg-blue-600', 'text-white', 'border-blue-500');
                    b.classList.remove('border-slate-600');
                }
            });

            // Modifiers UI
            const mods = btn.modifiers || 0;
            modifierCbs.forEach(cb => {
                const bit = parseInt(cb.dataset.mod);
                cb.checked = (mods & bit) !== 0;
            });

            updateEditorVisibility(btn.type);
            updateValueHint();
        }

        function updateEditorVisibility(type) {
            if (type === 0) { // HID
                modifiersSection.classList.remove('hidden');
            } else {
                modifiersSection.classList.add('hidden');
            }
        }

        function updateValueHint() {
            if (selectedBtnIndex === -1) return;
            const type = config.buttons[selectedBtnIndex].type;
            const label = document.getElementById('valueHint');
            if (type === 0) label.textContent = "HID Usage Code (e.g. 4=A, 40=Enter)";
            else if (type === 1) label.textContent = "HomeKit Trigger Index (0-255)";
            else if (type === 2) label.textContent = "Macro ID (Custom Logic)";
        }

        // --- Serial Comm ---

        async function readLoop() {
            while (port.readable && keepReading) {
                reader = port.readable.getReader();
                try {
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        const text = new TextDecoder().decode(value);
                        handleSerialData(text);
                    }
                } catch (e) {
                    console.error(e);
                } finally {
                    reader.releaseLock();
                }
            }
        }

        let serialBuffer = "";
        function handleSerialData(text) {
            serialBuffer += text;
            const lines = serialBuffer.split('\n');
            serialBuffer = lines.pop(); // Keep incomplete line

            for (const line of lines) {
                console.log("RXTX:", line);
                if (line.trim().startsWith('{')) {
                    try {
                        const json = JSON.parse(line);
                        handleConfigUpdate(json);
                    } catch (e) {
                        console.log("JSON Parse Error", e);
                    }
                } else if (line.startsWith("OK:")) {
                    setStatus(line, 'green');
                } else if (line.startsWith("ERR:")) {
                    setStatus(line, 'red');
                }
            }
        }

        async function writeToSerial(data) {
            if (!port || !port.writable) return;
            writer = port.writable.getWriter();
            await writer.write(new TextEncoder().encode(data));
            writer.releaseLock();
        }

        function handleConfigUpdate(newConfig) {
            // Merge
            if (newConfig.buttons) {
                config.buttons = newConfig.buttons;
            }
            if (newConfig.baseColor) {
                config.baseColor = newConfig.baseColor;
                const hex = rgbToHex(config.baseColor[0], config.baseColor[1], config.baseColor[2]);
                baseColorPicker.value = hex;
            }
            renderGrid();

            // If we have a selected button, refresh editor (unless user is actively typing?)
            if (selectedBtnIndex !== -1) {
                // Be careful not to overwrite user input while typing... 
                // For now, let's just refresh to ensure sync
                selectButton(selectedBtnIndex);
            }
            setStatus("Config Loaded", "green");
        }

        function setStatus(msg, color = 'slate') {
            statusMsg.textContent = msg;
            statusMsg.className = `text-sm font-mono h-6 transition-colors duration-300 text-${color}-400`;
            if (color === 'red') console.error(msg);
        }

        // --- Utils ---
        function componentToHex(c) {
            var hex = c.toString(16);
            return hex.length == 1 ? "0" + hex : hex;
        }
        function rgbToHex(r, g, b) {
            return "#" + componentToHex(r) + componentToHex(g) + componentToHex(b);
        }
        function hexToRgb(hex) {
            var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function xorEncrypt(input) {
            let output = "";
            for (let i = 0; i < input.length; i++) {
                const charCode = input.charCodeAt(i) ^ 0xAA;
                output += charCode.toString(16).padStart(2, '0').toUpperCase();
            }
            return output;
        }

    </script>
</body>

</html>
